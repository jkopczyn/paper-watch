# Tag-filtered ForumMagnum GraphQL feeds (LessWrong / Alignment Forum): newest
# posts carrying the tag, kept only at/above min_karma. Sturdier than the RSS
# feed and lets us set our own karma bar. Find a tag's _id with a
# tags(tagBySlug) query against the endpoint. LW AI is takes-ier than AF, so
# it gets a low source prior (see source_priors default "graphql": 0.3).
graphql:
  - name: LessWrong AI
    endpoint: https://www.lesswrong.com/graphql
    tag_id: sYm3HiWcfZvrGu3ui   # the "AI" tag (slug: ai)
    min_karma: 30

# Blogs with no RSS feed, watched by diffing the index page's link set (new
# link => new post; the first run seeds a baseline and yields nothing).
# `trusted: true` skips the LLM relevance gate, for blogs that are all signal.
pages:
  - {name: Anthropic Alignment Science, url: https://alignment.anthropic.com/, trusted: true}

# Twitter handles (AGI Safety Core list). Seed these with:
#   paper-watch seed-handles --from-file handles.txt
# (the list members page needs a logged-in browser; see README).
handles: []

nitter_instances:
  - https://nitter.net
  - https://nitter.poast.org
nitter_min_interval: 2.0          # seconds between Nitter requests; raise if you see 429s

# Slack #papers channels (MATS, FAR) and the alignment-Slack channel where
# Aaron Scher collects papers. Each workspace needs a user token (xoxp-…) with
# channels:history / groups:history / channels:read scopes, named here by the
# env var that holds it (the token stays in .env, not in this file). Fill in the
# channel IDs with `paper-watch slack-channels --workspace <name>`. Mark a
# curated channel `trusted: true` to bypass the relevance gate for all its
# items; otherwise only "obviously a paper" links (paper_link_domains below)
# bypass and the rest go through the gate.
slack:
  paper_link_domains:
    - arxiv.org
    - lesswrong.com
    - alignmentforum.org
    - openreview.net
    - anthropic.com
    - openai.com
    - deepmind.google
    - transformer-circuits.pub
  workspaces: []
    # - name: mats
    #   token_env: SLACK_TOKEN_MATS
    #   channels:
    #     - {id: C0000000, name: papers}
    # - name: far
    #   token_env: SLACK_TOKEN_FAR
    #   channels:
    #     - {id: C0000000, name: papers}
    # - name: alignment
    #   token_env: SLACK_TOKEN_ALIGNMENT
    #   channels:
    #     - {id: C0000000, name: aaron-papers, trusted: true}

scoring:
  overlap: 1.0
  velocity: 1.0
  feedback: 1.0
  resurface_boost: 0.5

smtp:
  host: smtp.gmail.com
  port: 587
  username: ja.kopczynski@gmail.com
  from_addr: ja.kopczynski@gmail.com
  to_addrs:                        # every recipient gets the same digest email; a
    - ja.kopczynski@gmail.com      # Slack channel/DM email address posts it there too
    - '"PRG Team (Slack)" <channel-address@example.slack.com>'

llm:
  model: claude-haiku-4-5        # or claude-opus-4-8 for higher-quality enrichment
  # date_model: claude-sonnet-5  # publication-date fallback; called rarely, so a stronger tier is cheap
  max_enrich_per_run: 50

alerts:                            # operational failures (a crashed tick, a digest long overdue)
  log_file: paper-watch-alerts.log # always appended to
  desktop: true                    # notify-send on this machine
  email: true                      # to smtp.from_addr only (not the digest recipients)
  slack_workspace: null            # a workspace from slack.workspaces, plus ONE of:
  slack_channel: null              #   a channel the bot is in, or
  slack_user: null                 #   a person to DM — member ID (im:write) or email (also users:read.email)
  overdue_after_hours: 24          # alert when a due digest is still unsent this long after its slot
